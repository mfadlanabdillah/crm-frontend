name: CRM CI

on:
  push:
    branches:
      - staging
      - master
  pull_request:
    branches:
      - development
      - staging
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build, size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Enable pnpm
        run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Check
        run: pnpm check

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Enable pnpm
        run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      # Keyed on the lockfile, so any dependency change re-downloads the browser; on a hit the
      # install below still adds OS packages but skips the download.
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install browsers
        run: pnpm --filter @crm/crm-console exec playwright install --with-deps chromium
      - name: E2E
        run: pnpm test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/crm-console/playwright-report
            examples/e2e/playwright-report
          retention-days: 7

  image:
    name: Docker image
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build
        run: docker build -t crm-console:${{ github.sha }} .
      - name: nginx config valid
        run: docker run --rm crm-console:${{ github.sha }} nginx -t
      - name: No source maps or MSW worker in image
        run: |
          docker run --rm --entrypoint sh crm-console:${{ github.sha }} -c \
            '! find /usr/share/nginx/html \( -name "*.map" -o -name mockServiceWorker.js \) | grep .'
